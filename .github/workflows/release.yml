name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" > /dev/null || true

      # Auto version bump: 9.0.<run number>, versionCode = run number (always increases)
      - name: Compute version
        run: |
          echo "VERSION_NAME=9.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace \
            -PappVersionCode=$VERSION_CODE -PappVersionName=$VERSION_NAME 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk "BixbyX-v$VERSION_NAME.apk"

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E '^e: |error:|What went wrong|Could not|Cannot|No matching|Unresolved' -A3 build.log | head -80; echo '```'; } > err.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat err.md)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: BixbyX-v${{ env.VERSION_NAME }}
          path: BixbyX-v${{ env.VERSION_NAME }}.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: BixbyX v${{ env.VERSION_NAME }}
          files: BixbyX-v${{ env.VERSION_NAME }}.apk
          generate_release_notes: true
          make_latest: true
